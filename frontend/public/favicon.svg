<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <!-- White background -->
  <rect width="100" height="100" fill="#ffffff"/>
  <!-- Green outer L-bracket (top + left only) -->
  <path d="M0,0 L100,0" stroke="#2e6417" stroke-width="6" fill="none" stroke-linejoin="miter"/>
  <path d="M0,0 L0,100" stroke="#2e6417" stroke-width="6" fill="none" stroke-linejoin="miter"/>
  <!-- Red inner L-bracket -->
  <path d="M15,15 L100,15" stroke="#dc2626" stroke-width="5.5" fill="none"/>
  <path d="M15,15 L15,100" stroke="#dc2626" stroke-width="5.5" fill="none"/>
  <!-- K lettermark -->
  <text x="33" y="82" font-family="Arial Black, Helvetica Neue, sans-serif" font-size="62" font-weight="900" fill="#0d1b2a" letter-spacing="-2">K</text>
</svg>
