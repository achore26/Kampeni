# Kampeni Intelligence — Railway monorepo deployment
#
# This file covers the API Gateway (the entry point the frontend calls).
# Each other service is added as a separate Railway service pointing at the same repo.
# See DEPLOY.md for the full step-by-step guide.
#
# IMPORTANT: In Railway dashboard, set Root Directory = "backend" for EVERY service.
# This makes COPY shared/ work correctly in all Dockerfiles.

[build]
builder = "DOCKERFILE"
dockerfilePath = "services/api-gateway/Dockerfile"

[deploy]
startCommand = "uvicorn app.main:app --host 0.0.0.0 --port $PORT"
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 3
healthcheckPath = "/health"
healthcheckTimeout = 30
