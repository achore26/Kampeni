name: Backend CI

on:
  push:
    branches: [main, develop]
    paths: ['backend/**']
  pull_request:
    branches: [main, develop]
    paths: ['backend/**']

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: kampeni_test
          POSTGRES_USER: kampeni
          POSTGRES_PASSWORD: kampeni_test
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    strategy:
      matrix:
        service: [api-gateway, sentiment, opponent, briefing]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install dependencies
        working-directory: backend/services/${{ matrix.service }}
        run: pip install -r requirements.txt pytest pytest-asyncio httpx

      - name: Lint
        working-directory: backend/services/${{ matrix.service }}
        run: |
          pip install ruff mypy
          ruff check .

      - name: Test
        working-directory: backend/services/${{ matrix.service }}
        env:
          POSTGRES_HOST: localhost
          POSTGRES_DB: kampeni_test
          POSTGRES_USER: kampeni
          POSTGRES_PASSWORD: kampeni_test
          REDIS_URL: redis://localhost:6379/0
        run: python -m pytest -v
