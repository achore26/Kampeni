version: "3.9"

# Production compose — runs on a single EC2 instance.
# Images are pulled from ECR. Set ECR_REGISTRY and IMAGE_TAG in .env.
# No MinIO (uses S3 via IAM role). No Qdrant/ClickHouse (not needed for MVP).

x-service-defaults: &service-defaults
  restart: unless-stopped
  env_file: .env
  logging:
    driver: "json-file"
    options:
      max-size: "50m"
      max-file: "5"

services:
  # ── Infrastructure ───────────────────────────────────────────────────────────
  postgres:
    <<: *service-defaults
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-kampeni}
      POSTGRES_USER: ${POSTGRES_USER:-kampeni}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-kampeni}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    <<: *service-defaults
    image: redis:7-alpine
    command: redis-server --requirepass ${REDIS_PASSWORD} --appendonly yes
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Nginx reverse proxy — SSL handled by Cloudflare, EC2 serves HTTP only ────
  nginx:
    <<: *service-defaults
    image: nginx:alpine
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - api-gateway

  # ── Backend Services ─────────────────────────────────────────────────────────
  api-gateway:
    <<: *service-defaults
    image: ${ECR_REGISTRY}/kampeni-production/api-gateway:${IMAGE_TAG:-latest}
    expose:
      - "8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      - APP_ENV=production
      - POSTGRES_HOST=postgres
      - REDIS_URL=redis://:${REDIS_PASSWORD}@redis:6379/0
      - MINIO_ENDPOINT=
      - MINIO_BUCKET=${S3_BUCKET}
      - SENTIMENT_SERVICE_URL=http://sentiment:8001
      - OPPONENT_SERVICE_URL=http://opponent:8002
      - BRIEFING_SERVICE_URL=http://briefing:8003
      - INGESTION_SERVICE_URL=http://ingestion:8004
      - TRANSLATION_SERVICE_URL=http://translation:8005
      - PAINPOINT_SERVICE_URL=http://painpoint:8006

  sentiment:
    <<: *service-defaults
    image: ${ECR_REGISTRY}/kampeni-production/sentiment:${IMAGE_TAG:-latest}
    expose:
      - "8001"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      - APP_ENV=production
      - POSTGRES_HOST=postgres
      - REDIS_URL=redis://:${REDIS_PASSWORD}@redis:6379/0

  opponent:
    <<: *service-defaults
    image: ${ECR_REGISTRY}/kampeni-production/opponent:${IMAGE_TAG:-latest}
    expose:
      - "8002"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      - APP_ENV=production
      - POSTGRES_HOST=postgres
      - REDIS_URL=redis://:${REDIS_PASSWORD}@redis:6379/0

  briefing:
    <<: *service-defaults
    image: ${ECR_REGISTRY}/kampeni-production/briefing:${IMAGE_TAG:-latest}
    expose:
      - "8003"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      - APP_ENV=production
      - POSTGRES_HOST=postgres
      - REDIS_URL=redis://:${REDIS_PASSWORD}@redis:6379/0

  ingestion:
    <<: *service-defaults
    image: ${ECR_REGISTRY}/kampeni-production/ingestion:${IMAGE_TAG:-latest}
    expose:
      - "8004"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      - APP_ENV=production
      - POSTGRES_HOST=postgres
      - REDIS_URL=redis://:${REDIS_PASSWORD}@redis:6379/0
      - MINIO_ENDPOINT=
      - MINIO_BUCKET=${S3_BUCKET}

  translation:
    <<: *service-defaults
    image: ${ECR_REGISTRY}/kampeni-production/translation:${IMAGE_TAG:-latest}
    expose:
      - "8005"
    depends_on:
      redis:
        condition: service_healthy
    environment:
      - APP_ENV=production
      - REDIS_URL=redis://:${REDIS_PASSWORD}@redis:6379/0
      - MINIO_ENDPOINT=
      - MINIO_BUCKET=${S3_BUCKET}

  painpoint:
    <<: *service-defaults
    image: ${ECR_REGISTRY}/kampeni-production/painpoint:${IMAGE_TAG:-latest}
    expose:
      - "8006"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      - APP_ENV=production
      - POSTGRES_HOST=postgres
      - REDIS_URL=redis://:${REDIS_PASSWORD}@redis:6379/0
      - MINIO_ENDPOINT=
      - MINIO_BUCKET=${S3_BUCKET}

  prefect-worker:
    <<: *service-defaults
    image: ${ECR_REGISTRY}/kampeni-production/prefect-worker:${IMAGE_TAG:-latest}
    depends_on:
      - ingestion
      - sentiment
      - briefing
      - translation
      - painpoint
      - opponent
    environment:
      - APP_ENV=production
      - PREFECT_API_URL=${PREFECT_API_URL}
      - REDIS_URL=redis://:${REDIS_PASSWORD}@redis:6379/0
      - INGESTION_SERVICE_URL=http://ingestion:8004
      - SENTIMENT_SERVICE_URL=http://sentiment:8001
      - BRIEFING_SERVICE_URL=http://briefing:8003
      - TRANSLATION_SERVICE_URL=http://translation:8005
      - PAINPOINT_SERVICE_URL=http://painpoint:8006
      - OPPONENT_SERVICE_URL=http://opponent:8002

volumes:
  postgres_data:
  redis_data:
