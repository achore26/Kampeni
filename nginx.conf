events { worker_connections 1024; }

http {
    # Rate limiting — Cloudflare IPs are the actual client so limit by forwarded IP
    limit_req_zone $http_x_forwarded_for zone=api:10m rate=30r/m;

    upstream api_gateway {
        server api-gateway:8000;
    }

    # Cloudflare terminates SSL — EC2 only needs to serve HTTP on port 80
    server {
        listen 80;
        server_name _;

        # API Gateway — all /api/* traffic
        location /api/ {
            limit_req zone=api burst=20 nodelay;
            proxy_pass         http://api_gateway;
            proxy_set_header   Host $host;
            proxy_set_header   X-Real-IP $http_x_forwarded_for;
            proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto https;
            proxy_read_timeout 60s;
        }

        # Health check
        location /health {
            proxy_pass http://api_gateway/health;
        }
    }
}
