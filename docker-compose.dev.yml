version: "3.9"

# Development overrides — hot reload, volume mounts, debug ports
services:
  api-gateway:
    volumes:
      - ./backend/services/api-gateway:/app
      - ./backend/shared:/app/shared
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

  ingestion:
    volumes:
      - ./backend/services/ingestion:/app
      - ./backend/shared:/app/shared

  sentiment:
    volumes:
      - ./backend/services/sentiment:/app
      - ./backend/shared:/app/shared
    command: uvicorn app.main:app --host 0.0.0.0 --port 8001 --reload

  opponent:
    volumes:
      - ./backend/services/opponent:/app
      - ./backend/shared:/app/shared
    command: uvicorn app.main:app --host 0.0.0.0 --port 8002 --reload

  briefing:
    volumes:
      - ./backend/services/briefing:/app
      - ./backend/shared:/app/shared
    command: uvicorn app.main:app --host 0.0.0.0 --port 8003 --reload

  frontend:
    volumes:
      - ./frontend/src:/app/src
      - ./frontend/public:/app/public
    environment:
      - CHOKIDAR_USEPOLLING=true
