version: "3.9"

# Development overrides — hot reload, volume mounts
services:
  api-gateway:
    volumes:
      - ./backend/services/api-gateway/app:/app/app
      - ./backend/shared:/app/shared
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

  ingestion:
    volumes:
      - ./backend/services/ingestion/app:/app/app
      - ./backend/shared:/app/shared

  ingestion-worker:
    volumes:
      - ./backend/services/ingestion/app:/app/app
      - ./backend/shared:/app/shared
    command: celery -A app.worker worker --beat --loglevel=info

  sentiment:
    volumes:
      - ./backend/services/sentiment/app:/app/app
      - ./backend/shared:/app/shared
    command: uvicorn app.main:app --host 0.0.0.0 --port 8001 --reload

  sentiment-worker:
    volumes:
      - ./backend/services/sentiment/app:/app/app
      - ./backend/shared:/app/shared
    command: celery -A app.worker worker --beat --loglevel=info

  opponent:
    volumes:
      - ./backend/services/opponent/app:/app/app
      - ./backend/shared:/app/shared
    command: uvicorn app.main:app --host 0.0.0.0 --port 8002 --reload

  opponent-worker:
    volumes:
      - ./backend/services/opponent/app:/app/app
      - ./backend/shared:/app/shared
    command: celery -A app.worker worker --beat --loglevel=info

  briefing:
    volumes:
      - ./backend/services/briefing/app:/app/app
      - ./backend/shared:/app/shared
    command: uvicorn app.main:app --host 0.0.0.0 --port 8003 --reload

  frontend:
    volumes:
      - ./frontend/src:/app/src
      - ./frontend/public:/app/public
    environment:
      - CHOKIDAR_USEPOLLING=true
