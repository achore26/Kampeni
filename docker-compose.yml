version: "3.9"

services:
  # ─── Infrastructure ──────────────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-kampeni}
      POSTGRES_USER: ${POSTGRES_USER:-kampeni}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-kampeni_dev}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-kampeni}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    command: redis-server --requirepass ${REDIS_PASSWORD:-kampeni_redis_dev}
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  qdrant:
    image: qdrant/qdrant:latest
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage

  clickhouse:
    image: clickhouse/clickhouse-server:latest
    ports:
      - "9002:9000"
      - "8123:8123"
    volumes:
      - clickhouse_data:/var/lib/clickhouse
    ulimits:
      nofile:
        soft: 262144
        hard: 262144

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9090"
    ports:
      - "9000:9000"             # S3 API (needed by services on host for local dev)
      - "127.0.0.1:9090:9090"  # MinIO console — local access only
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-kampeni}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-kampeni_dev_secret}
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ─── Backend Services ─────────────────────────────────────────────────────
  api-gateway:
    build:
      context: ./backend
      dockerfile: services/api-gateway/Dockerfile
    env_file: .env
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      - POSTGRES_HOST=postgres
      - REDIS_URL=redis://:${REDIS_PASSWORD:-kampeni_redis_dev}@redis:6379/0
      - QDRANT_HOST=qdrant
      - SENTIMENT_SERVICE_URL=http://sentiment:8001
      - OPPONENT_SERVICE_URL=http://opponent:8002
      - BRIEFING_SERVICE_URL=http://briefing:8003
      - INGESTION_SERVICE_URL=http://ingestion:8004
      - TRANSLATION_SERVICE_URL=http://translation:8005
      - PAINPOINT_SERVICE_URL=http://painpoint:8006

  ingestion:
    build:
      context: ./backend
      dockerfile: services/ingestion/Dockerfile
    env_file: .env
    ports:
      - "127.0.0.1:8004:8004"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    environment:
      - POSTGRES_HOST=postgres
      - REDIS_URL=redis://:${REDIS_PASSWORD:-kampeni_redis_dev}@redis:6379/0
      - MINIO_ENDPOINT=http://minio:9000
      - MINIO_ACCESS_KEY=${MINIO_ROOT_USER:-kampeni}
      - MINIO_SECRET_KEY=${MINIO_ROOT_PASSWORD:-kampeni_dev_secret}
      - MINIO_BUCKET=kampeni-raw

  sentiment:
    build:
      context: ./backend
      dockerfile: services/sentiment/Dockerfile
    env_file: .env
    ports:
      - "127.0.0.1:8001:8001"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      qdrant:
        condition: service_started
    environment:
      - POSTGRES_HOST=postgres
      - REDIS_URL=redis://:${REDIS_PASSWORD:-kampeni_redis_dev}@redis:6379/0
      - QDRANT_HOST=qdrant

  opponent:
    build:
      context: ./backend
      dockerfile: services/opponent/Dockerfile
    env_file: .env
    ports:
      - "127.0.0.1:8002:8002"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      - POSTGRES_HOST=postgres
      - REDIS_URL=redis://:${REDIS_PASSWORD:-kampeni_redis_dev}@redis:6379/0

  briefing:
    build:
      context: ./backend
      dockerfile: services/briefing/Dockerfile
    env_file: .env
    ports:
      - "127.0.0.1:8003:8003"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      - POSTGRES_HOST=postgres
      - REDIS_URL=redis://:${REDIS_PASSWORD:-kampeni_redis_dev}@redis:6379/0

  translation:
    build:
      context: ./backend
      dockerfile: services/translation/Dockerfile
    env_file: .env
    ports:
      - "127.0.0.1:8005:8005"
    depends_on:
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    environment:
      - REDIS_URL=redis://:${REDIS_PASSWORD:-kampeni_redis_dev}@redis:6379/0
      - MINIO_ENDPOINT=http://minio:9000
      - MINIO_ACCESS_KEY=${MINIO_ROOT_USER:-kampeni}
      - MINIO_SECRET_KEY=${MINIO_ROOT_PASSWORD:-kampeni_dev_secret}
      - MINIO_BUCKET=kampeni-raw

  painpoint:
    build:
      context: ./backend
      dockerfile: services/painpoint/Dockerfile
    env_file: .env
    ports:
      - "127.0.0.1:8006:8006"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    environment:
      - POSTGRES_HOST=postgres
      - REDIS_URL=redis://:${REDIS_PASSWORD:-kampeni_redis_dev}@redis:6379/0
      - MINIO_ENDPOINT=http://minio:9000
      - MINIO_ACCESS_KEY=${MINIO_ROOT_USER:-kampeni}
      - MINIO_SECRET_KEY=${MINIO_ROOT_PASSWORD:-kampeni_dev_secret}
      - MINIO_BUCKET=kampeni-raw

  # ─── Orchestration (Prefect) ──────────────────────────────────────────────
  prefect-server:
    image: prefecthq/prefect:3-latest
    command: prefect server start --host 0.0.0.0
    ports:
      - "127.0.0.1:4200:4200"
    environment:
      - PREFECT_UI_API_URL=http://localhost:4200/api
    volumes:
      - prefect_data:/root/.prefect
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:4200/api/health')"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 30s

  prefect-worker:
    build:
      context: ./flows
    environment:
      - PREFECT_API_URL=http://prefect-server:4200/api
      - INGESTION_SERVICE_URL=http://ingestion:8004
      - SENTIMENT_SERVICE_URL=http://sentiment:8001
      - BRIEFING_SERVICE_URL=http://briefing:8003
      - TRANSLATION_SERVICE_URL=http://translation:8005
      - PAINPOINT_SERVICE_URL=http://painpoint:8006
      - OPPONENT_SERVICE_URL=http://opponent:8002
      - INTERNAL_TRIGGER_SECRET=${INTERNAL_TRIGGER_SECRET}
    depends_on:
      prefect-server:
        condition: service_healthy
      ingestion:
        condition: service_started
      sentiment:
        condition: service_started
      briefing:
        condition: service_started
      translation:
        condition: service_started
      painpoint:
        condition: service_started
      opponent:
        condition: service_started

  # ─── Frontend ─────────────────────────────────────────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        - VITE_AUTH0_DOMAIN=${VITE_AUTH0_DOMAIN}
        - VITE_AUTH0_CLIENT_ID=${VITE_AUTH0_CLIENT_ID}
        - VITE_AUTH0_AUDIENCE=${VITE_AUTH0_AUDIENCE}
        - VITE_API_URL=${VITE_API_URL:-/api/v1}
        - VITE_CANDIDATE_ID=${VITE_CANDIDATE_ID}
    ports:
      - "3000:3000"
    environment:
      - API_GATEWAY_URL=http://api-gateway:8000
      - VITE_AUTH0_DOMAIN=${VITE_AUTH0_DOMAIN}
      - VITE_AUTH0_CLIENT_ID=${VITE_AUTH0_CLIENT_ID}
      - VITE_AUTH0_AUDIENCE=${VITE_AUTH0_AUDIENCE}
      - VITE_CANDIDATE_ID=${VITE_CANDIDATE_ID}
    volumes:
      - ./frontend/src:/app/src
    depends_on:
      - api-gateway

volumes:
  postgres_data:
  qdrant_data:
  clickhouse_data:
  minio_data:
  prefect_data:
